apiVersion: v1
kind: Secret
metadata:
  name: ty-multiverse-backend-secrets
type: Opaque
stringData:
  SPRING_DATASOURCE_URL: "${SPRING_DATASOURCE_URL}"
  SPRING_DATASOURCE_USERNAME: "${SPRING_DATASOURCE_USERNAME}"
  SPRING_DATASOURCE_PASSWORD: "${SPRING_DATASOURCE_PASSWORD}"
  SPRING_PEOPLE_DATASOURCE_URL: "${SPRING_PEOPLE_DATASOURCE_URL}"
  SPRING_PEOPLE_DATASOURCE_USERNAME: "${SPRING_PEOPLE_DATASOURCE_USERNAME}"
  SPRING_PEOPLE_DATASOURCE_PASSWORD: "${SPRING_PEOPLE_DATASOURCE_PASSWORD}"
  REDIS_HOST: "${REDIS_HOST}"
  REDIS_CUSTOM_PORT: "${REDIS_CUSTOM_PORT}"
  REDIS_PASSWORD: "${REDIS_PASSWORD}"
  REDIS_QUEUE_TYMB: "${REDIS_QUEUE_TYMB}"
  KEYCLOAK_AUTH_SERVER_URL: "${KEYCLOAK_AUTH_SERVER_URL}"
  PUBLIC_REALM: "${PUBLIC_REALM}"
  PUBLIC_CLIENT_ID: "${PUBLIC_CLIENT_ID}"
  KEYCLOAK_CREDENTIALS_SECRET: "${KEYCLOAK_CREDENTIALS_SECRET}"
  PUBLIC_TYMB_URL: "${PUBLIC_TYMB_URL}"
  PUBLIC_FRONTEND_URL: "${PUBLIC_FRONTEND_URL}"
  AI_USAGE_INGEST_TOKEN: "${AI_USAGE_INGEST_TOKEN}"
---

apiVersion: v1
kind: ConfigMap
metadata:
  name: ty-multiverse-backend-config
data:
  SPRING_PROFILES_ACTIVE: "platform" 
  SERVER_PORT: "8080"
  LOGGING_LEVEL: "INFO"
  LOGGING_LEVEL_SPRINGFRAMEWORK: "INFO"
  PROJECT_ENV: "platform"
  # OCI Object Storage (research-zone company-product mapping). Instance Principal auth — no secrets.
  OCI_OS_ENABLED: "true"
  OCI_OS_REGION: "ap-singapore-2"
  OCI_OS_NAMESPACE: "axbptfyngj39"
  OCI_OS_BUCKET: "peoplesystem-object-storage-20260618"
  OCI_OS_OBJECT: "company-product-mapping.json"
  OCI_OS_AUTH: "instance_principal"

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ty-multiverse-backend
  labels:
    app.kubernetes.io/name: ty-multiverse-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ty-multiverse-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ty-multiverse-backend
    spec:
      imagePullSecrets:
      - name: dockerhub-credentials
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - jenkins
              topologyKey: "kubernetes.io/hostname"
      containers:
      - name: ty-multiverse-backend
        image: papakao/ty-multiverse-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        startupProbe:
          httpGet:
            path: /tymb/actuator/health
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 40
        readinessProbe:
          httpGet:
            path: /tymb/actuator/health
            port: 8080
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /tymb/actuator/health
            port: 8080
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"  # 請求 512MB 記憶體
          limits:
            cpu: "500m"      # 提升 CPU 限制以加快啟動
            memory: "1Gi"  # 限制最多 1GB 記憶體
        env:
        - name: SERVER_PORT
          valueFrom:
            configMapKeyRef:
              name: ty-multiverse-backend-config
              key: SERVER_PORT
        - name: SPRING_PROFILES_ACTIVE
          valueFrom:
            configMapKeyRef:
              name: ty-multiverse-backend-config
              key: SPRING_PROFILES_ACTIVE
        - name: LOGGING_LEVEL
          valueFrom:
            configMapKeyRef:
              name: ty-multiverse-backend-config
              key: LOGGING_LEVEL
        - name: LOGGING_LEVEL_SPRINGFRAMEWORK
          valueFrom:
            configMapKeyRef:
              name: ty-multiverse-backend-config
              key: LOGGING_LEVEL_SPRINGFRAMEWORK
        - name: SPRING_DATASOURCE_URL
          valueFrom:
            secretKeyRef:
              name: ty-multiverse-backend-secrets
              key: SPRING_DATASOURCE_URL
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: ty-multiverse-backend-secrets
              key: SPRING_DATASOURCE_USERNAME
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ty-multiverse-backend-secrets
              key: SPRING_DATASOURCE_PASSWORD
        - name: SPRING_PEOPLE_DATASOURCE_URL
          valueFrom:
            secretKeyRef:
              name: ty-multiverse-backend-secrets
              key: SPRING_PEOPLE_DATASOURCE_URL
        - name: SPRING_PEOPLE_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: ty-multiverse-backend-secrets
              key: SPRING_PEOPLE_DATASOURCE_USERNAME
        - name: SPRING_PEOPLE_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ty-multiverse-backend-secrets
              key: SPRING_PEOPLE_DATASOURCE_PASSWORD
        - name: KEYCLOAK_AUTH_SERVER_URL
          valueFrom:
            secretKeyRef:
              name: ty-multiverse-backend-secrets
              key: KEYCLOAK_AUTH_SERVER_URL
        - name: PUBLIC_REALM
          valueFrom:
            secretKeyRef:
              name: ty-multiverse-backend-secrets
              key: PUBLIC_REALM
        - name: PUBLIC_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: ty-multiverse-backend-secrets
              key: PUBLIC_CLIENT_ID
        - name: KEYCLOAK_CREDENTIALS_SECRET
          valueFrom:
            secretKeyRef:
              name: ty-multiverse-backend-secrets
              key: KEYCLOAK_CREDENTIALS_SECRET
        - name: PUBLIC_TYMB_URL
          valueFrom:
            secretKeyRef:
              name: ty-multiverse-backend-secrets
              key: PUBLIC_TYMB_URL
        - name: PUBLIC_FRONTEND_URL
          valueFrom:
            secretKeyRef:
              name: ty-multiverse-backend-secrets
              key: PUBLIC_FRONTEND_URL
        - name: AI_USAGE_INGEST_TOKEN
          valueFrom:
            secretKeyRef:
              name: ty-multiverse-backend-secrets
              key: AI_USAGE_INGEST_TOKEN
        - name: PROJECT_ENV
          valueFrom:
            configMapKeyRef:
              name: ty-multiverse-backend-config
              key: PROJECT_ENV
        - name: OCI_OS_ENABLED
          valueFrom:
            configMapKeyRef:
              name: ty-multiverse-backend-config
              key: OCI_OS_ENABLED
        - name: OCI_OS_REGION
          valueFrom:
            configMapKeyRef:
              name: ty-multiverse-backend-config
              key: OCI_OS_REGION
        - name: OCI_OS_NAMESPACE
          valueFrom:
            configMapKeyRef:
              name: ty-multiverse-backend-config
              key: OCI_OS_NAMESPACE
        - name: OCI_OS_BUCKET
          valueFrom:
            configMapKeyRef:
              name: ty-multiverse-backend-config
              key: OCI_OS_BUCKET
        - name: OCI_OS_OBJECT
          valueFrom:
            configMapKeyRef:
              name: ty-multiverse-backend-config
              key: OCI_OS_OBJECT
        - name: OCI_OS_AUTH
          valueFrom:
            configMapKeyRef:
              name: ty-multiverse-backend-config
              key: OCI_OS_AUTH
        - name: REDIS_HOST
          valueFrom:
            secretKeyRef:
              name: ty-multiverse-backend-secrets
              key: REDIS_HOST
        - name: REDIS_CUSTOM_PORT
          valueFrom:
            secretKeyRef:
              name: ty-multiverse-backend-secrets
              key: REDIS_CUSTOM_PORT
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ty-multiverse-backend-secrets
              key: REDIS_PASSWORD
        - name: REDIS_QUEUE_TYMB
          valueFrom:
            secretKeyRef:
              name: ty-multiverse-backend-secrets
              key: REDIS_QUEUE_TYMB
        - name: SPRING_PEOPLE_DATASOURCE_ENABLED
          value: "false"
        # RabbitMQ 配置 - Production 環境啟用
        - name: RABBITMQ_ENABLED
          value: "true"
        - name: RABBITMQ_HOST
          value: "rabbitmq-service"
        - name: RABBITMQ_PORT
          value: "5672"
        - name: RABBITMQ_USERNAME
          valueFrom:
            secretKeyRef:
              name: rabbitmq-credentials
              key: RABBITMQ_DEFAULT_USER
        - name: RABBITMQ_PASSWORD
          valueFrom:
            secretKeyRef:
              name: rabbitmq-credentials
              key: RABBITMQ_DEFAULT_PASS
        - name: RABBITMQ_VIRTUAL_HOST
          value: "/"
        # JVM 記憶體配置
        - name: JAVA_OPTS
          value: "-Xms256m -Xmx640m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+UseStringDeduplication"
        # Session 配置
        - name: APP_SESSION_ENABLED
          value: "false"  # 暫時禁用 Session 支持
        - name: APP_SESSION_TIMEOUT
          value: "1800"  # 30分鐘，與應用程序配置保持一致

---

apiVersion: v1
kind: Service
metadata:
  name: ty-multiverse-backend
  labels:
    app.kubernetes.io/name: ty-multiverse-backend
spec:
  selector:
    app.kubernetes.io/name: ty-multiverse-backend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
  type: ClusterIP
---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ty-multiverse-backend-ingress
spec:
  ingressClassName: nginx
  rules:
  - host: peoplesystem.tatdvsonorth.com
    http:
      paths:
      - path: /tymb
        pathType: Prefix
        backend:
          service:
            name: ty-multiverse-backend
            port:
              number: 80
