# RabbitMQ 單節點持久化部署（Phase 1）
#
# 注意：這份資源不由 Jenkins 管理，只需手動 apply 一次。
#   kubectl apply -f rabbitmq-deployment.yaml
#
# 從舊的 Deployment(emptyDir) 切換到 StatefulSet(PVC) 會有短暫停機，
# 切換前請先確認所有 queue 皆為空。
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-credentials
  labels:
    app: rabbitmq
type: Opaque
stringData:
  RABBITMQ_DEFAULT_USER: "admin"
  RABBITMQ_DEFAULT_PASS: "admin123"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-config
  labels:
    app: rabbitmq
data:
  enabled_plugins: |
    [rabbitmq_management,rabbitmq_prometheus,rabbitmq_stream,rabbitmq_stream_management].
  rabbitmq.conf: |
    # 基本配置（單節點，不做 peer discovery）
    listeners.tcp.default = 5672
    management.tcp.port = 15672

    # Stream Protocol
    stream.listeners.tcp.1 = 5552

    # 記憶體和磁碟限制
    vm_memory_high_watermark.relative = 0.6
    disk_free_limit.relative = 2.0

    # 連接限制
    tcp_listen_options.backlog = 128
    tcp_listen_options.nodelay = true

    # 日誌配置
    log.console = true
    log.console.level = info
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-headless
  labels:
    app: rabbitmq
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: rabbitmq
  ports:
  - name: amqp
    port: 5672
    targetPort: 5672
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-service
  labels:
    app: rabbitmq
spec:
  selector:
    app: rabbitmq
  ports:
  - name: amqp
    port: 5672
    targetPort: 5672
  - name: management
    port: 15672
    targetPort: 15672
  - name: stream
    port: 5552
    targetPort: 5552
  type: ClusterIP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  labels:
    app: rabbitmq
spec:
  serviceName: rabbitmq-headless
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 999
        # 只在 volume 根目錄 owner 不符時才遞迴改權限，避免每次重啟都把
        # .erlang.cookie 改成 group-readable（Erlang 會因此拒絕啟動）。
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
      # 保險措施：PVC 上殘留的 cookie 權限若不是 0600，Erlang 開機會直接 crash。
      - name: fix-erlang-cookie
        image: rabbitmq:4.1-management
        command:
        - sh
        - -c
        - 'if [ -f /var/lib/rabbitmq/.erlang.cookie ]; then chmod 600 /var/lib/rabbitmq/.erlang.cookie; fi'
        volumeMounts:
        - name: rabbitmq-data
          mountPath: /var/lib/rabbitmq
      containers:
      - name: rabbitmq
        image: rabbitmq:4.1-management
        ports:
        - containerPort: 5672
          name: amqp
        - containerPort: 15672
          name: management
        - containerPort: 5552
          name: stream
        env:
        # StatefulSet 的 pod 名稱固定為 rabbitmq-0，node name 因此穩定，
        # 重建後可以掛回同一個 PVC 上的 mnesia 目錄。
        - name: RABBITMQ_NODENAME
          value: "rabbit@localhost"
        - name: RABBITMQ_USE_LONGNAME
          value: "false"
        - name: RABBITMQ_DEFAULT_VHOST
          value: "/"
        - name: RABBITMQ_DEFAULT_USER
          valueFrom:
            secretKeyRef:
              name: rabbitmq-credentials
              key: RABBITMQ_DEFAULT_USER
        - name: RABBITMQ_DEFAULT_PASS
          valueFrom:
            secretKeyRef:
              name: rabbitmq-credentials
              key: RABBITMQ_DEFAULT_PASS
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        volumeMounts:
        - name: rabbitmq-data
          mountPath: /var/lib/rabbitmq
        - name: rabbitmq-config
          mountPath: /etc/rabbitmq/conf.d/10-tymb.conf
          subPath: rabbitmq.conf
        - name: rabbitmq-config
          mountPath: /etc/rabbitmq/enabled_plugins
          subPath: enabled_plugins
        readinessProbe:
          exec:
            command: ["rabbitmq-diagnostics", "-q", "check_port_connectivity"]
          initialDelaySeconds: 20
          periodSeconds: 15
          timeoutSeconds: 15
          failureThreshold: 6
        livenessProbe:
          exec:
            command: ["rabbitmq-diagnostics", "-q", "ping"]
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 15
          failureThreshold: 5
      volumes:
      - name: rabbitmq-config
        configMap:
          name: rabbitmq-config
  volumeClaimTemplates:
  - metadata:
      name: rabbitmq-data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: oci-bv
      resources:
        requests:
          # OCI Block Volume 最小容量為 50Gi
          storage: 50Gi
